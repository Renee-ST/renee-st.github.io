short_bio: >-
  <p>
    I am an M.S. student at China University of Geosciences (Beijing). My research interests lie at the intersection of
    <strong>computer vision</strong>, <strong>GeoAI</strong>, <strong>spatiotemporal representation learning</strong>, and <strong>remote sensing</strong>.
  </p>
  <p>
    I am particularly interested in learning robust spatial, spectral, and temporal representations from multi-source Earth observation data,
    with applications to tropical cyclone analysis and agricultural remote sensing.
  </p>

